[workspace]
resolver = "2"
members = ["crates/semdf", "crates/hdf5-df"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/weathership/semantics"
rust-version = "1.80"

[workspace.dependencies]
async-trait = "0.1"
datafusion = "50"
hdf5-pure = "0.39"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
