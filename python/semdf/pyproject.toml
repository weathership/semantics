[project]
name = "semdf"
version = "0.1.0"
description = "SemDF: Arrow field metadata for SDG/SysML-bound scientific columns"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semdf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
